<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ZER023 — Catálogo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0d0d;
        --cd: #161617;
        --ln: #2a2b2e;
        --mu: #8a8c90;
        --fg: #fafaf8;
        --r: #ff3b1d;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        background: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.3;
      }
      .w {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .mo {
        font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 12px;
        color: var(--mu);
      }
      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: #000;
        border-bottom: 1px solid var(--ln);
        padding: 10px 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .bar .mo {
        margin-left: auto;
      }
      button,
      .btn {
        font:
          600 13px Archivo,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--mu);
        padding: 9px 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      button.red {
        background: var(--r);
        border-color: var(--r);
        color: #0d0d0d;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding-top: 44px;
      }
      .rule {
        width: 120px;
        height: 8px;
        background: var(--r);
        margin: 26px 0 20px;
      }
      h1 {
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        line-height: 1;
        font-size: clamp(34px, 7vw, 64px);
        margin: 0 0 10px;
      }
      .in {
        background: #000;
        border: 1px solid var(--ln);
        color: var(--fg);
        font: inherit;
        padding: 8px;
        width: 100%;
        margin: 0;
      }
      .in:focus {
        outline: 2px solid var(--r);
        outline-offset: 0;
      }
      .g {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(2, 1fr);
        margin: 28px 0;
      }
      @media (min-width: 720px) {
        .g {
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }
      }
      @media (min-width: 1040px) {
        .g {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .c {
        background: var(--cd);
        border: 2px solid var(--ln);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .ph {
        aspect-ratio: 4/3;
        background: var(--ln);
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .ph .mo {
        font-size: 10px;
        text-align: center;
        padding: 8px;
      }
      .num {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 11px;
      }
      .tag {
        position: absolute;
        right: 0;
        top: 0;
        background: var(--r);
        color: #0d0d0d;
        font:
          500 11px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.1em;
        padding: 5px 9px;
      }
      .b {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .n {
        font-weight: 800;
        text-transform: uppercase;
        font-size: clamp(13px, 2.6vw, 17px);
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .p {
        font-weight: 800;
        font-size: clamp(20px, 4vw, 26px);
      }
      .z {
        font:
          500 11px "IBM Plex Mono",
          monospace;
        border: 1px solid var(--ln);
        padding: 3px 6px;
        margin: 0 4px 4px 0;
        display: inline-block;
        color: var(--fg);
        background: none;
      }
      .z.off {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .ask {
        margin-top: auto;
        padding-top: 6px;
        color: var(--fg);
        font:
          500 11px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        border-top: 1px solid var(--ln);
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .row button {
        padding: 6px 9px;
        font-size: 11px;
      }
      footer {
        border-top: 2px solid var(--ln);
        padding: 22px 0 40px;
      }
      .cols {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .cols b {
        display: block;
        font-size: 22px;
        font-weight: 800;
        margin-top: 4px;
      }
      .cta {
        display: block;
        background: var(--r);
        color: #0d0d0d;
        text-align: center;
        font:
          500 16px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 18px;
        text-decoration: none;
      }
      .empty {
        padding: 60px 0;
        text-align: center;
      }

      /* Estilo do Modal de Zoom da Foto */
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 999;
        display: none;
        place-items: center;
        padding: 20px;
        cursor: zoom-out;
      }
      #modal img {
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
        border: 2px solid var(--ln);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal"><img id="modal-img" src="" alt="Zoom do Tênis" /></div>
    <input type="file" id="f" accept="image/*" hidden />
    <input type="file" id="importFile" accept=".json" hidden />

    <script>
      const DEFAULT_DATA = {
        t: "CATÁLOGO DE TÊNIS",
        s: "DROP EXCLUSIVO • ZER023",
        pg: "COLEÇÃO · 01",
        wa: "51999999999",
        ig: "@zer023.br",
        items: [
          {
            n: "Exemplo Modelo 1",
            p: "199,90",
            sz: [
              [38, 1],
              [39, 1],
              [40, 1],
              [41, 1],
            ],
            img: "",
            tag: true,
          },
          {
            n: "Exemplo Modelo 2",
            p: "229,90",
            sz: [
              [39, 1],
              [40, 1],
              [42, 1],
            ],
            img: "",
            tag: false,
          },
        ],
      };

      let S = JSON.parse(localStorage.getItem("zer023_data")) || DEFAULT_DATA;
      let IDX = 0,
        MSG = "";

      // Chave secreta pela URL (Ex: ?admin=0230)
      const urlParams = new URLSearchParams(window.location.search);
      const ED = urlParams.get("admin") === "0230";

      const $ = (s) => document.querySelector(s),
        A = $("#app");
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const LOGO =
        '<svg viewBox="0 0 420 80" width="150" aria-label="ZER023" style="display:block"><g fill="none" stroke="currentColor" stroke-width="12" stroke-miterlimit="2"><path d="M6 6H54L6 74H54"/><path transform="translate(72)" d="M54 6H6V74H54M6 40H46"/><path transform="translate(144)" d="M6 74V6H38Q54 6 54 23Q54 40 38 40H6M32 40L54 74"/><g transform="translate(216)"><rect x="6" y="6" width="48" height="68" rx="24"/><path stroke="#FF3B1D" d="M10 70L50 10"/></g><path transform="translate(288)" d="M6 6H54V40H6V74H54"/><path transform="translate(360)" d="M6 6H54V74H6M20 40H54"/></g></svg>';
      const money = (p) => {
        p = String(p || "").trim();
        return !p ? "" : /^r\$/i.test(p) ? p : "R$ " + p;
      };
      const waNum = () => {
        let d = (S.wa || "").replace(/\D/g, "");
        return !d ? "" : d.length <= 11 ? "55" + d : d;
      };
      const waLink = (t) => {
        const n = waNum();
        return n
          ? "https://wa.me/" + n + (t ? "?text=" + encodeURIComponent(t) : "")
          : "";
      };
      const igLink = () => {
        const h = (S.ig || "")
          .replace(/^.*instagram\.com\//, "")
          .replace(/[@\/\s]/g, "");
        return h ? "https://instagram.com/" + h : "";
      };
      const pad = (i) => String(i + 1).padStart(2, "0");

      function parseSz(v, old) {
        const o = {};
        (old || []).forEach((x) => (o[x[0]] = x[1]));
        let ns = [];
        v.split(/[\s,;]+/)
          .filter(Boolean)
          .forEach((t) => {
            const m = t.match(/^(\d+)[-\/–](\d+)$/);
            if (m) {
              for (let k = +m[1]; k <= +m[2] && k < 100; k++) ns.push(k);
            } else if (/^\d+$/.test(t)) ns.push(+t);
          });
        return [...new Set(ns)]
          .sort((a, b) => a - b)
          .map((n) => [n, n in o ? o[n] : 1]);
      }

      function card(it, i) {
        const chips = it.sz
          .map(([n, on]) =>
            ED
              ? `<button class="z${on ? "" : " off"}" data-a="chip" data-i="${i}" data-n="${n}">${n}</button>`
              : `<span class="z${on ? "" : " off"}">${n}</span>`,
          )
          .join("");
        const ph = it.img
          ? `<img src="${esc(it.img)}" alt="${esc(it.n)}">`
          : `<span class="mo">[imagem do tênis aqui]</span>`;

        if (!ED) {
          const av = it.sz
            .filter((x) => x[1])
            .map((x) => x[0])
            .join(", ");
          const l = waLink(
            "Olá! Tenho interesse no " +
              it.n +
              (av ? " (numeração: " + av + ")" : ""),
          );
          const clickAction = it.img
            ? `data-a="zoom" data-img="${esc(it.img)}"`
            : "";
          return `<article class="c"><div class="ph" ${clickAction}>${ph}<span class="mo num">${pad(i)}</span>${it.tag ? '<span class="tag">NOVO</span>' : ""}</div><div class="b"><div class="n">${esc(it.n)}</div><div class="p">${esc(money(it.p))}</div><div>${chips}</div>${l ? `<a class="ask" href="${l}" target="_blank" rel="noopener">Pedir no WhatsApp →</a>` : ""}</div></article>`;
        }

        return `<article class="c">
    <div class="ph" data-a="img" data-i="${i}">${ph}<span class="mo num">${pad(i)}</span>${it.tag ? '<span class="tag">NOVO</span>' : ""}</div>
    <div class="b">
      <button data-a="img" data-i="${i}">${it.img ? "Trocar foto" : "Adicionar foto"}</button>
      <input class="in" placeholder="Nome do modelo" value="${esc(it.n)}" data-k="items.${i}.n">
      <input class="in" placeholder="Preço (ex.: 199,90)" value="${esc(it.p)}" data-k="items.${i}.p">
      <input class="in" placeholder="Tamanhos (ex.: 38-43 ou 38 40 42)" value="${esc(it.sz.map((x) => x[0]).join(" "))}" data-sz="${i}">
      <div>${chips}</div><small class="mo" style="font-size:10px">Toque no número para marcar esgotado</small>
      <div class="row">
        <button data-a="tag" data-i="${i}">${it.tag ? "Tirar “novo”" : "Marcar “novo”"}</button>
        <button data-a="up" data-i="${i}">↑</button>
        <button data-a="dn" data-i="${i}">↓</button>
        <button data-a="del" data-i="${i}">Excluir</button>
      </div>
    </div>
  </article>`;
      }

      function R() {
        const vis = S.items
          .map((it, i) => [it, i])
          .filter(([it]) => ED || it.n || it.img);

        // Barra de ferramentas visível APENAS no modo admin secreto
        const bar = ED
          ? `<div class="bar">
    <span class="mo" style="color:var(--r); font-weight:bold;">MODO ADMIN ATIVO</span>
    <button data-a="add">+ Adicionar modelo</button>
    <button class="red" data-a="save">Salvar Alterações</button>
    <button data-a="export">Exportar Backup</button>
    <button data-a="import">Importar Backup</button>
    <span class="mo">${esc(MSG)}</span>
  </div>`
          : "";

        const head = ED
          ? `<input class="in" placeholder="Título da coleção" value="${esc(S.t)}" data-k="t" style="margin-bottom:8px">
     <input class="in" placeholder="Subtítulo ou data do drop" value="${esc(S.s)}" data-k="s" style="margin-bottom:8px">
     <input class="in" placeholder="Página (ex.: COLEÇÃO · 01/02)" value="${esc(S.pg)}" data-k="pg">`
          : `<h1>${esc(S.t)}</h1><div class="mo">${esc(S.s)}</div>`;

        const wa = waLink("Olá! Vim pelo catálogo da ZER023."),
          ig = igLink();
        const foot = ED
          ? `<div class="cols">
       <div style="flex:1;min-width:220px"><span class="mo">WhatsApp</span><input class="in" placeholder="(51) 99999-9999" value="${esc(S.wa)}" data-k="wa"></div>
       <div style="flex:1;min-width:220px"><span class="mo">Instagram</span><input class="in" placeholder="@zer023.br" value="${esc(S.ig)}" data-k="ig"></div>
     </div>`
          : `<div class="cols">${S.wa ? `<div><span class="mo">WhatsApp</span><b>${esc(S.wa)}</b></div>` : ""}${S.ig ? `<div><span class="mo">Instagram</span><b>${ig ? `<a href="${ig}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(S.ig)}</a>` : esc(S.ig)}</b></div>` : ""}</div>${wa ? `<a class="cta" href="${wa}" target="_blank" rel="noopener">Chamar no WhatsApp</a>` : ""}`;

        A.innerHTML =
          bar +
          `<div class="w"><div class="top">${LOGO}<span class="mo">${ED ? "" : esc(S.pg)}</span></div><div class="rule"></div>${head}
  ${vis.length ? `<div class="g">${vis.map(([it, i]) => card(it, i)).join("")}</div>` : '<div class="empty mo">Catálogo vazio</div>'}<footer>${foot}</footer></div>`;
      }

      function setPath(p, v) {
        const k = p.split(".");
        let o = S;
        while (k.length > 1) o = o[k.shift()];
        o[k[0]] = v;
        MSG = "Alterações não salvas";
      }

      function shrink(file, cb) {
        const im = new Image(),
          u = URL.createObjectURL(file);
        im.onload = () => {
          const m = 900,
            s = Math.min(1, m / Math.max(im.width, im.height)),
            c = document.createElement("canvas");
          c.width = im.width * s;
          c.height = im.height * s;
          const x = c.getContext("2d");
          x.fillStyle = "#2A2B2E";
          x.fillRect(0, 0, c.width, c.height);
          x.drawImage(im, 0, 0, c.width, c.height);
          URL.revokeObjectURL(u);
          cb(c.toDataURL("image/jpeg", 0.82));
        };
        im.src = u;
      }

      // Eventos
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.dataset.k) setPath(t.dataset.k, t.value);
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.sz != null) {
          const it = S.items[t.dataset.sz];
          it.sz = parseSz(t.value, it.sz);
          MSG = "Alterações não salvas";
          R();
        }
      });

      document.addEventListener("click", (e) => {
        const modal = $("#modal");
        if (e.target.id === "modal" || e.target.id === "modal-img") {
          modal.style.display = "none";
          return;
        }

        const t = e.target.closest("[data-a]");
        if (!t) return;
        const a = t.dataset.a,
          i = +t.dataset.i,
          L = S.items;

        if (a === "zoom") {
          $("#modal-img").src = t.dataset.img;
          modal.style.display = "grid";
        } else if (a === "add") {
          L.push({ n: "", p: "", sz: [], img: "", tag: false });
          MSG = "Alterações não salvas";
        } else if (a === "del") {
          if (!confirm("Excluir este modelo?")) return;
          L.splice(i, 1);
          MSG = "Alterações não salvas";
        } else if (a === "tag") {
          L[i].tag = !L[i].tag;
          MSG = "Alterações não salvas";
        } else if (a === "chip") {
          const c = L[i].sz.find((x) => x[0] === +t.dataset.n);
          c[1] = c[1] ? 0 : 1;
          MSG = "Alterações não salvas";
        } else if (a === "up" && i > 0) {
          [L[i - 1], L[i]] = [L[i], L[i - 1]];
          MSG = "Alterações não salvas";
        } else if (a === "dn" && i < L.length - 1) {
          [L[i + 1], L[i]] = [L[i], L[i + 1]];
          MSG = "Alterações não salvas";
        } else if (a === "img") {
          IDX = i;
          $("#f").click();
          return;
        } else if (a === "save") {
          localStorage.setItem("zer023_data", JSON.stringify(S));
          MSG = "Salvo com sucesso!";
        } else if (a === "export") {
          const dataStr =
            "data:text/json;charset=utf-8," +
            encodeURIComponent(JSON.stringify(S));
          const dlAnchor = document.createElement("a");
          dlAnchor.setAttribute("href", dataStr);
          dlAnchor.setAttribute("download", "zer023_backup.json");
          document.body.appendChild(dlAnchor);
          dlAnchor.click();
          dlAnchor.remove();
          MSG = "Backup exportado!";
        } else if (a === "import") {
          $("#importFile").click();
          return;
        }
        R();
      });

      $("#f").addEventListener("change", (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (f)
          shrink(f, (d) => {
            S.items[IDX].img = d;
            MSG = "Alterações não salvas";
            R();
          });
      });

      $("#importFile").addEventListener("change", (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            S = JSON.parse(event.target.result);
            localStorage.setItem("zer023_data", JSON.stringify(S));
            MSG = "Backup importado com sucesso!";
            R();
          } catch (err) {
            alert("Arquivo de backup inválido.");
          }
        };
        reader.readAsText(f);
      });

      R();
    </script>
  </body>
</html>
